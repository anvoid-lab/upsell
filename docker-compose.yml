services:
  mongo:
    image: mongo:7
    container_name: anvoid-mongo
    restart: unless-stopped
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: anvoid
      MONGO_INITDB_ROOT_PASSWORD: anvoid
      MONGO_INITDB_DATABASE: anvoid_upsell
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
