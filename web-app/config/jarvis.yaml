# JARVIS Configuration
# Tunable settings per bounded context. ConfigService deep-merges
# these overrides over hardcoded defaults.

# ── Ollama (shared LLM infrastructure) ──────────────────────────────────────
# Three prerequisite models — install with:
#   ollama pull embeddinggemma:latest
#   ollama pull gpt-oss:20b
#   ollama pull llama3.2:latest
ollama:
  url: "http://localhost:11434"
  embeddingDimensions: 768
  models:
    embedding: "embeddinggemma"   # RAG index + context-search
    reasoning: "gpt-oss"          # specs, formal analysis, SDD, domain-map
    simple: "llama3.2"            # intent classification, summarisation, deploy-log
    summary: "llama3.2"           # short text summaries (vault enricher, doc previews)

azure-sync:
  organization: ""
  project: ""
  repository: ""
  authMethod: "az-cli"
  defaultSyncDirection: "push"
  autoDetectTemplate: true
  pollEnabled: false
  pollIntervalSecs: 60

kanban:
  minTransitionIntervalSecs: 0
  gateTasks:
    doing:
      - description: "Code changes committed to feature branch"
        required: true
        autoVerify: "none"
      - description: "tsc --noEmit passes with zero errors"
        required: true
        autoVerify: "none"
      - description: "All tests pass"
        required: true
        autoVerify: "none"
    review:
      - description: "All acceptance criteria met"
        required: true
        autoVerify: "ac-met"
      - description: "Code reviewed or self-reviewed with evidence"
        required: true
        autoVerify: "none"
    tested:
      - description: "All acceptance criteria met"
        required: true
        autoVerify: "ac-met"
      - description: "Merged to main or PR approved"
        required: true
        autoVerify: "none"

mcp-server:
  transport: "stdio"
  enabledTools: null

interaction:
  # verbosity controls LLM response length via system prompt injection.
  # concise (default): short, direct answers — details only when explicitly asked
  # normal: no instruction injected — default LLM behavior
  # verbose: detailed explanations and context always included
  verbosity: "concise"
  # balanceAlertUsd: WARNING in workspace-info when accumulated spend exceeds
  # this value (USD). null = no alert.
  balanceAlertUsd: null
